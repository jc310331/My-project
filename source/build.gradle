plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'com.jacob.companion'
version = '0.3.2'
base { archivesName = 'socrates' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { companion { source sourceSets.main } } }
        gameTestServer { workingDirectory project.file('run-gametest'); property 'forge.enabledGameTestNamespaces', (project.hasProperty('bridgeTests') ? 'companion,companion_bridge' : 'companion'); mods { companion { source sourceSets.main } } }
        server { workingDirectory project.file('run-server'); args '--nogui'; mods { companion { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named("jar").configure { finalizedBy "reobfJar" }
java { withSourcesJar() }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
